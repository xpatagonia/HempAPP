    <script type="module" src="/index.tsx?v=200.0"></script>
    <script>
      // AUTO-CACHE BUSTER V200
      (function() {
        var currentVersion = 'V200';
        var storedVersion = localStorage.getItem('app_v_check');
        
        if (storedVersion !== currentVersion) {
            console.log("⚠️ Version Mismatch. Clearing cache and upgrading to " + currentVersion);
            
            // 1. Clear Storage
            localStorage.setItem('app_v_check', currentVersion);
            
            // 2. Kill Service Workers
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) registration.unregister();
                });
            }

            // 3. Clear Caches API
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) caches.delete(name);
                });
            }
        }
      })();
    </script>
  </body>
