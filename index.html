    <!-- QUERY STRING V300.0 -->
    <script type="module" src="/index.tsx?v=300.0"></script>
    <script>
      // AUTO-CACHE BUSTER V300
      (function() {
        var currentVersion = 'V300';
        var storedVersion = localStorage.getItem('app_v_check');
        
        if (storedVersion !== currentVersion) {
            console.log("🔴 V300 CRIMSON: Cleaning old cache layers.");
            localStorage.setItem('app_v_check', currentVersion);
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) caches.delete(name);
                });
            }
        }
      })();
    </script>
