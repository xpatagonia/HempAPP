services:
  - type: web
    name: hempc-telemetry-engine
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEVICE_INGEST_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,https://hemp-net.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: VERCEL_EMAIL_WEBHOOK_URL
        value: "https://hemp-net.vercel.app/api/notifications/email"
      - key: RESEND_FROM_EMAIL
        value: "HempC Nucleus <notificaciones@hempc.com.ar>"
      - key: ALERT_RECIPIENT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
